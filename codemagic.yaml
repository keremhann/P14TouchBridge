workflows:
  p14-touch-bridge:
    name: P14 Touch Bridge
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Locate project
        script: |
          set -e
          echo "Current directory:"
          pwd
          echo
          echo "Repository contents:"
          find . -maxdepth 4 -print | sort
          echo
          PROJECT_PATH="$(find "$CM_BUILD_DIR" -type d -name 'P14TouchBridge.xcodeproj' | head -n 1)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: P14TouchBridge.xcodeproj could not be found anywhere in the cloned repository."
            exit 66
          fi
          echo "Found project at: $PROJECT_PATH"
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$CM_ENV"

      - name: Check Xcode project
        script: |
          set -e
          source "$CM_ENV"
          xcodebuild -version
          xcodebuild -project "$PROJECT_PATH" -list

      - name: Resolve project
        script: |
          set -e
          source "$CM_ENV"
          xcodebuild             -project "$PROJECT_PATH"             -scheme "P14TouchBridge"             -showBuildSettings > /tmp/buildsettings.txt
          head -120 /tmp/buildsettings.txt

      - name: Build unsigned archive
        script: |
          set -e
          source "$CM_ENV"
          rm -rf "$CM_BUILD_DIR/build"
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild clean archive             -project "$PROJECT_PATH"             -scheme "P14TouchBridge"             -configuration Release             -sdk iphoneos             -destination "generic/platform=iOS"             -archivePath "$CM_BUILD_DIR/build/P14TouchBridge.xcarchive"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/build/P14TouchBridge.xcarchive/Products/Applications/P14TouchBridge.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found: $APP_PATH"
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/build/Payload"
          mkdir -p "$CM_BUILD_DIR/build/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/Payload/"

          cd "$CM_BUILD_DIR/build"
          rm -f P14TouchBridge-unsigned.ipa
          zip -qry P14TouchBridge-unsigned.ipa Payload
          echo "Created: $CM_BUILD_DIR/build/P14TouchBridge-unsigned.ipa"

    artifacts:
      - build/P14TouchBridge-unsigned.ipa
      - build/P14TouchBridge.xcarchive
