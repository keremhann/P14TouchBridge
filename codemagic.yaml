workflows:
  p14-touch-bridge:
    name: P14 Touch Bridge
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Locate project
        script: |
          set -e
          PROJECT_PATH="$(find "$CM_BUILD_DIR" -type d -name 'P14TouchBridge.xcodeproj' | head -n 1)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: P14TouchBridge.xcodeproj not found."
            find "$CM_BUILD_DIR" -maxdepth 4 -print | sort
            exit 66
          fi
          echo "Found project at: $PROJECT_PATH"
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$CM_ENV"

      - name: Check Xcode project
        script: |
          set -e
          source "$CM_ENV"
          xcodebuild -version
          xcodebuild -project "$PROJECT_PATH" -list

      - name: Build unsigned iPhone app
        script: |
          set -e
          source "$CM_ENV"
          rm -rf "$CM_BUILD_DIR/build"
          mkdir -p "$CM_BUILD_DIR/build"

          xcodebuild clean build             -project "$PROJECT_PATH"             -scheme "P14TouchBridge"             -configuration Release             -sdk iphoneos             -destination "generic/platform=iOS"             -derivedDataPath "$CM_BUILD_DIR/build/DerivedData"             PRODUCT_BUNDLE_IDENTIFIER="com.ceto.P14TouchBridge"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Verify bundle identifier
        script: |
          set -e
          APP_PATH="$(find "$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name 'P14TouchBridge.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app not found."
            find "$CM_BUILD_DIR/build" -maxdepth 6 -print | sort
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$CM_ENV"
          echo "Bundle identifier:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"

      - name: Package unsigned IPA
        script: |
          set -e
          source "$CM_ENV"
          rm -rf "$CM_BUILD_DIR/build/Payload"
          mkdir -p "$CM_BUILD_DIR/build/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/Payload/"
          cd "$CM_BUILD_DIR/build"
          rm -f P14TouchBridge-unsigned.ipa
          zip -qry P14TouchBridge-unsigned.ipa Payload
          echo "Created: $CM_BUILD_DIR/build/P14TouchBridge-unsigned.ipa"

    artifacts:
      - build/P14TouchBridge-unsigned.ipa
